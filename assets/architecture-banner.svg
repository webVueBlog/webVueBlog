<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jeskson — Full-stack Architect</title>
  <desc id="desc">Animated technology banner highlighting IoT, distributed systems, and AI engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".48" stop-color="#10234a"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35d6ff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#2fffa3"/></linearGradient>
    <radialGradient id="orb"><stop offset="0" stop-color="#35d6ff" stop-opacity=".8"/><stop offset="1" stop-color="#35d6ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8bbcff" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="terminalClip"><rect x="68" y="178" width="565" height="28" rx="4"/></clipPath>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="60" r="210" fill="url(#orb)" opacity=".2"><animate attributeName="opacity" values=".14;.3;.14" dur="5s" repeatCount="indefinite"/></circle>
  <g opacity=".6" fill="none" stroke="url(#accent)" stroke-width="2">
    <path d="M790 210 C850 110 930 275 1000 150 S1130 100 1170 185" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" values="0;-100" dur="7s" repeatCount="indefinite"/></path>
    <circle cx="790" cy="210" r="7" fill="#35d6ff" filter="url(#glow)"/><circle cx="925" cy="205" r="7" fill="#7c5cff" filter="url(#glow)"/><circle cx="1000" cy="150" r="7" fill="#2fffa3" filter="url(#glow)"/><circle cx="1170" cy="185" r="7" fill="#35d6ff" filter="url(#glow)"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="68" y="84" fill="#dceaff" font-size="18" letter-spacing="4">HELLO, I BUILD SYSTEMS THAT SCALE</text>
    <text x="64" y="144" fill="url(#accent)" font-size="56" font-weight="800">JESKSON</text>
    <rect x="66" y="161" width="410" height="3" rx="2" fill="url(#accent)"><animate attributeName="width" values="0;410;410" keyTimes="0;.4;1" dur="3s" repeatCount="indefinite"/></rect>
    <g clip-path="url(#terminalClip)"><text x="68" y="200" fill="#9db4d5" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Full-stack Architect · IoT · Distributed Systems · AI<animate attributeName="x" values="-500;68;68" keyTimes="0;.45;1" dur="5s" repeatCount="indefinite"/></text></g>
    <g font-size="15" font-weight="600" text-anchor="middle">
      <g transform="translate(68 244)"><rect width="116" height="38" rx="19" fill="#35d6ff" fill-opacity=".12" stroke="#35d6ff" stroke-opacity=".55"/><text x="58" y="24" fill="#bceeff">IoT</text></g>
      <g transform="translate(198 244)"><rect width="150" height="38" rx="19" fill="#7c5cff" fill-opacity=".12" stroke="#927cff" stroke-opacity=".55"/><text x="75" y="24" fill="#d4caff">Microservices</text></g>
      <g transform="translate(362 244)"><rect width="154" height="38" rx="19" fill="#2fffa3" fill-opacity=".1" stroke="#2fffa3" stroke-opacity=".5"/><text x="77" y="24" fill="#baffdf">Cloud Native</text></g>
      <g transform="translate(530 244)"><rect width="132" height="38" rx="19" fill="#35d6ff" fill-opacity=".12" stroke="#35d6ff" stroke-opacity=".55"/><text x="66" y="24" fill="#bceeff">AI Apps</text></g>
    </g>
  </g>
  <g fill="#dceaff"><circle cx="775" cy="72" r="3"><animate attributeName="cy" values="72;58;72" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="1110" cy="250" r="2"><animate attributeName="cy" values="250;232;250" dur="4.1s" repeatCount="indefinite"/></circle><circle cx="1030" cy="92" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="860" cy="270" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle></g>
</svg>
